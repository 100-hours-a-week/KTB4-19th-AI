[project]
name = "zipsai"
version = "0.1.0"
description = "Document indexing API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "fastapi>=0.115",
    "pydantic>=2,<3",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zipsai*"]
namespaces = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
exclude = ["evals"]
