[project]
name = "zipsai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nuebaek", email = "nuebaek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "langgraph>=1.2.11",
    "openai>=3.14.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[project.scripts]
zipsai = "zipsai:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
