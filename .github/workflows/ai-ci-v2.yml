name: AI CI V2
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: ai-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed services, separately from image rebuilds
        id: detect
        shell: python
        run: |
          import json, os, subprocess
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          head = os.environ["GITHUB_SHA"]
          if "pull_request" in event:
              head = event["pull_request"]["head"]["sha"]
              base = subprocess.check_output(["git", "merge-base", event["pull_request"]["base"]["sha"], head], text=True).strip()
          else:
              base = event.get("before", "")
          if not base or set(base) == {"0"}:
              paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", head], text=True).splitlines()
          else:
              paths = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines()
          def compose_services(revision):
              result = subprocess.run(["git", "show", revision + ":compose.v2.yaml"],
                                      capture_output=True, text=True)
              if result.returncode:
                  return {}
              parsed = subprocess.check_output(
                  ["ruby", "-ryaml", "-rjson", "-e",
                   "puts JSON.generate(YAML.safe_load(STDIN.read, aliases: true))"],
                  input=result.stdout, text=True)
              document = json.loads(parsed)
              # Top-level settings can affect every service.
              return document
          compose_changed = "compose.v2.yaml" in paths
          before_compose = compose_services(base) if base and set(base) != {"0"} else {}
          after_compose = compose_services(head)
          shared_changed = ({k:v for k,v in before_compose.items() if k != "services"} !=
                            {k:v for k,v in after_compose.items() if k != "services"})
          services, matrix = [], []
          workflow_ci = ".github/workflows/ai-ci-v2.yml" in paths
          workflow_cd = ".github/workflows/ai-cd-v2.yml" in paths
          for service, directory, context, dockerfile, repository in [
              ("ai-api", "ai", ".", "ai/Dockerfile", "zipsai-ai-api"),
              ("embedding", "embedding", "embedding", "embedding/Dockerfile", "zipsai-embedding"),
              ("qdrant", "", "", "", "")]:
              code = service != "qdrant" and (
                  workflow_ci or any(p.startswith(directory + "/") for p in paths)
                  or (service == "ai-api" and ".dockerignore" in paths))
              compose = compose_changed and (shared_changed or
                  before_compose.get("services", {}).get(service) !=
                  after_compose.get("services", {}).get(service))
              if code or compose or workflow_cd:
                  services.append({"service": service, "rebuild": code})
              if code:
                  matrix.append(dict(service=service, directory=directory, context=context,
                                     dockerfile=dockerfile, repository=repository))
          with open("deployment-selection.json", "w") as stream:
              json.dump({"revision": head, "services": services}, stream)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("matrix=" + json.dumps({"include": matrix}) + "\n")
              stream.write("build=" + str(bool(matrix)).lower() + "\n")
          print("Changed services:", services)
      - name: Validate Compose with synthetic values only
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d)"
          cp compose.v2.yaml "$task_dir/"
          printf '%s\n' 'LLM_API_KEY=test' > "$task_dir/runtime.env"
          export IMAGE_URI=example.invalid/validation:only AWS_REGION=ap-northeast-2
          export LOG_GROUP=/validation QDRANT_ADMIN_API_KEY=test-admin QDRANT_READ_ONLY_API_KEY=test-read
          docker compose --project-directory "$task_dir" -f "$task_dir/compose.v2.yaml" config -q
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ai-v2-selection
          path: deployment-selection.json
          retention-days: 30
  test-build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '${{ matrix.directory }}/uv.lock'
      - name: Test changed application
        working-directory: ${{ matrix.directory }}
        run: |
          uv sync --frozen --all-groups
          uv run pytest
      - name: Configure V2 publishing role
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_AI_CI_V2_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve SHA7 and detect immutable image
        if: github.event_name == 'push'
        id: image
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA::7}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if aws ecr describe-images --repository-name "$REPOSITORY" \
              --image-ids imageTag="$image_tag" > /dev/null 2> ecr-error.txt; then
              echo "build=false" >> "$GITHUB_OUTPUT"
            elif ! grep -q ImageNotFoundException ecr-error.txt; then
              echo 'ECR lookup failed; not treating it as a missing image.' >&2
              exit 1
            fi
          fi
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && steps.image.outputs.build == 'true'
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name == 'push' && steps.image.outputs.build == 'true'
      - name: Build changed service; push only on staging
        # PR: application tests and Compose validation only. Build the merged staging revision.
        if: github.event_name == 'push' && steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: '${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ steps.image.outputs.tag }}'
          labels: 'org.opencontainers.image.revision=${{ github.sha }}'
          cache-from: type=gha,scope=ai-v2-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ai-v2-${{ matrix.service }}
      - name: Record published digest
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          echo "$REPOSITORY:$IMAGE_TAG → $digest" >> "$GITHUB_STEP_SUMMARY"
