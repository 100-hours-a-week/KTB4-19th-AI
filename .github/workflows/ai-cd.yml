name: AI CD

# AI API와 Embedding Image는 각각 독립적으로 배포한다.
# 최초 배포에서는 두 Image Tag를 모두 입력해야 하며, 이후에는 변경할 서비스만 입력한다.
on:
  workflow_dispatch:
    inputs:
      ai_api_commit_sha:
        description: AI API에 배포할 main Commit SHA 앞 7자리 (변경하지 않으면 비움)
        required: false
        type: string
      embedding_commit_sha:
        description: Embedding에 배포할 main Commit SHA 앞 7자리 (변경하지 않으면 비움)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-06c0ca0d997f03792
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  APP_DIR: /opt/zipsai

jobs:
  deploy:
    name: AI Image 배포
    # 수동 실행 화면에서 다른 Branch를 골라도 운영 배포는 main에서만 허용한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 입력한 짧은 SHA가 실제 main Commit인지 확인한 뒤 ECR Tag 형식(앞 7자리)으로 통일한다.
      - name: Verify requested commits
        id: version
        env:
          API_INPUT: ${{ inputs.ai_api_commit_sha }}
          EMBEDDING_INPUT: ${{ inputs.embedding_commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "$API_INPUT" ] && [ -z "$EMBEDDING_INPUT" ]; then
            echo "AI API 또는 Embedding Commit SHA 중 하나는 입력해야 합니다." >&2
            exit 1
          fi

          resolve_main_tag() {
            local input_sha="$1"
            local resolved_sha
            resolved_sha="$(git rev-parse "${input_sha}^{commit}")"
            git merge-base --is-ancestor "$resolved_sha" origin/main
            printf '%s' "${resolved_sha::7}"
          }

          if [ -n "$API_INPUT" ]; then
            echo "api_tag=$(resolve_main_tag "$API_INPUT")" >> "$GITHUB_OUTPUT"
            echo "api_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=" >> "$GITHUB_OUTPUT"
            echo "api_requested=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$EMBEDDING_INPUT" ]; then
            echo "embedding_tag=$(resolve_main_tag "$EMBEDDING_INPUT")" >> "$GITHUB_OUTPUT"
            echo "embedding_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "embedding_tag=" >> "$GITHUB_OUTPUT"
            echo "embedding_requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # AI Repository CD 전용 OIDC Role ARN을 Repository Variable에 등록한다.
          role-to-assume: ${{ vars.AWS_AI_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy selected AI Image and wait for health check
        env:
          API_TAG: ${{ steps.version.outputs.api_tag }}
          EMBEDDING_TAG: ${{ steps.version.outputs.embedding_tag }}
          API_REQUESTED: ${{ steps.version.outputs.api_requested }}
          EMBEDDING_REQUESTED: ${{ steps.version.outputs.embedding_requested }}
        run: |
          set -euo pipefail

          # GitHub는 SSM으로 배포 명령만 전달한다.
          # ECR Login과 Docker Compose 실행은 EC2 Instance Role 및 EC2 내부에서 수행한다.
          jq -n \
            --arg app_dir "$APP_DIR" \
            --arg aws_region "$AWS_REGION" \
            --arg ecr_registry "$ECR_REGISTRY" \
            --arg api_tag "$API_TAG" \
            --arg embedding_tag "$EMBEDDING_TAG" \
            --arg api_requested "$API_REQUESTED" \
            --arg embedding_requested "$EMBEDDING_REQUESTED" \
            '{
              commands: [
                "set -euo pipefail",
                ("sudo test -f " + $app_dir + "/.env"),
                ("current_api=$(sudo sed -n \\"s/^AI_API_IMAGE_TAG=//p\\" " + $app_dir + "/.env | tail -n 1 || true)"),
                ("current_embedding=$(sudo sed -n \\"s/^EMBEDDING_IMAGE_TAG=//p\\" " + $app_dir + "/.env | tail -n 1 || true)"),
                ("target_api=\\\"" + $api_tag + "\\\"; [ -n \\"$target_api\\" ] || target_api=\\\"$current_api\\\""),
                ("target_embedding=\\\"" + $embedding_tag + "\\\"; [ -n \\"$target_embedding\\" ] || target_embedding=\\\"$current_embedding\\\""),
                "if [ -z \\"$target_api\\" ] || [ -z \\"$target_embedding\\" ]; then echo \\"최초 AI 배포에서는 AI API와 Embedding Commit SHA를 모두 입력해야 합니다.\\" >&2; exit 1; fi",
                ("set_env() { key=\\\"$1\\\"; value=\\\"$2\\\"; if sudo grep -q \\"^${key}=\\" " + $app_dir + "/.env; then sudo sed -i \\"s|^${key}=.*|${key}=${value}|\\" " + $app_dir + "/.env; else printf \\"%s=%s\\\\n\\" \\"$key\\" \\"$value\\" | sudo tee -a " + $app_dir + "/.env > /dev/null; fi; }"),
                "set_env AI_API_IMAGE_TAG \\"$target_api\\"",
                "set_env EMBEDDING_IMAGE_TAG \\"$target_embedding\\"",
                ("sudo chown root:root " + $app_dir + "/.env && sudo chmod 600 " + $app_dir + "/.env"),
                ("aws ecr get-login-password --region " + $aws_region + " | sudo docker login --username AWS --password-stdin " + $ecr_registry),
                ("compose() { sudo docker compose --profile ai --env-file " + $app_dir + "/.env -f " + $app_dir + "/compose.yaml \\"$@\\"; }"),
                ("if [ \\"" + $api_requested + "\\" = true ] && [ \\"" + $embedding_requested + "\\" = true ]; then compose pull ai-api embedding; compose up -d qdrant embedding ai-api; elif [ \\"" + $api_requested + "\\" = true ]; then compose pull ai-api; compose up -d --no-deps ai-api; else compose pull embedding; compose up -d --no-deps embedding; fi"),
                ("wait_healthy() { service=\\\"$1\\\"; for _ in $(seq 1 36); do container_id=$(compose ps -q \\"$service\\"); if [ -n \\"$container_id\\" ]; then status=$(sudo docker inspect --format '\''{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}'\'' \\"$container_id\\"); echo \\"$service: $status\\"; [ \\"$status\\" = healthy ] && return 0; fi; sleep 5; done; echo \\"$service Health Check timed out.\\" >&2; return 1; }"),
                ("if [ \\"" + $api_requested + "\\" = true ]; then wait_healthy ai-api; fi"),
                ("if [ \\"" + $embedding_requested + "\\" = true ]; then wait_healthy embedding; fi")
              ]
            }' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy AI API=${API_TAG:-current}, Embedding=${EMBEDDING_TAG:-current}" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
