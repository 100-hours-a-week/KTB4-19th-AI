name: AI CD

# AI API와 Embedding Image는 각각 독립적으로 배포한다.
# 최초 배포에서는 두 Image Tag를 모두 입력해야 하며, 이후에는 변경할 서비스만 입력한다.
on:
  workflow_dispatch:
    inputs:
      ai_api_commit_sha:
        description: AI API에 배포할 main Commit SHA 앞 7자리 (변경하지 않으면 비움)
        required: false
        type: string
      embedding_commit_sha:
        description: Embedding에 배포할 main Commit SHA 앞 7자리 (변경하지 않으면 비움)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-06c0ca0d997f03792
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  APP_DIR: /opt/zipsai
  AI_API_CURRENT_SHA_PARAMETER: /zipsai/prod/deploy/ai-api/current-sha
  EMBEDDING_CURRENT_SHA_PARAMETER: /zipsai/prod/deploy/embedding/current-sha

jobs:
  deploy:
    name: AI Image 배포
    # 수동 실행 화면에서 다른 Branch를 골라도 운영 배포는 main에서만 허용한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 입력한 짧은 SHA가 실제 main Commit인지 확인한 뒤 ECR Tag 형식(앞 7자리)으로 통일한다.
      - name: Verify requested commits
        id: version
        env:
          API_INPUT: ${{ inputs.ai_api_commit_sha }}
          EMBEDDING_INPUT: ${{ inputs.embedding_commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "$API_INPUT" ] && [ -z "$EMBEDDING_INPUT" ]; then
            echo "AI API 또는 Embedding Commit SHA 중 하나는 입력해야 합니다." >&2
            exit 1
          fi

          resolve_main_tag() {
            local input_sha="$1"
            local resolved_sha
            resolved_sha="$(git rev-parse "${input_sha}^{commit}")"
            git merge-base --is-ancestor "$resolved_sha" origin/main
            printf '%s' "${resolved_sha::7}"
          }

          if [ -n "$API_INPUT" ]; then
            echo "api_tag=$(resolve_main_tag "$API_INPUT")" >> "$GITHUB_OUTPUT"
            echo "api_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=" >> "$GITHUB_OUTPUT"
            echo "api_requested=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$EMBEDDING_INPUT" ]; then
            echo "embedding_tag=$(resolve_main_tag "$EMBEDDING_INPUT")" >> "$GITHUB_OUTPUT"
            echo "embedding_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "embedding_tag=" >> "$GITHUB_OUTPUT"
            echo "embedding_requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_AI_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy selected AI Image and rollback on failed health check
        env:
          API_TAG: ${{ steps.version.outputs.api_tag }}
          EMBEDDING_TAG: ${{ steps.version.outputs.embedding_tag }}
          API_REQUESTED: ${{ steps.version.outputs.api_requested }}
          EMBEDDING_REQUESTED: ${{ steps.version.outputs.embedding_requested }}
        run: |
          set -euo pipefail

          # EC2에서 실행할 배포 명령을 전송하고, 대상 Container Health Check까지 완료될 때만 성공한다.
          run_remote_deploy() {
            local api_tag="$1"
            local embedding_tag="$2"
            local api_requested="$3"
            local embedding_requested="$4"
            local encoded_script command_id status

            {
              printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
              printf 'APP_DIR=%q\n' "$APP_DIR"
              printf 'AWS_REGION=%q\n' "$AWS_REGION"
              printf 'ECR_REGISTRY=%q\n' "$ECR_REGISTRY"
              printf 'API_TAG=%q\n' "$api_tag"
              printf 'EMBEDDING_TAG=%q\n' "$embedding_tag"
              printf 'API_REQUESTED=%q\n' "$api_requested"
              printf 'EMBEDDING_REQUESTED=%q\n' "$embedding_requested"
              cat <<'REMOTE_SCRIPT'
              sudo test -f "$APP_DIR/.env"

              current_api="$(sudo sed -n 's/^AI_API_IMAGE_TAG=//p' "$APP_DIR/.env" | tail -n 1 || true)"
              current_embedding="$(sudo sed -n 's/^EMBEDDING_IMAGE_TAG=//p' "$APP_DIR/.env" | tail -n 1 || true)"

              target_api="$API_TAG"
              [ -n "$target_api" ] || target_api="$current_api"
              target_embedding="$EMBEDDING_TAG"
              [ -n "$target_embedding" ] || target_embedding="$current_embedding"

              if [ -z "$target_api" ] || [ -z "$target_embedding" ]; then
                echo "최초 AI 배포에서는 AI API와 Embedding Commit SHA를 모두 입력해야 합니다." >&2
                exit 1
              fi

              set_env() {
                key="$1"
                value="$2"
                if sudo grep -q "^${key}=" "$APP_DIR/.env"; then
                  sudo sed -i "s|^${key}=.*|${key}=${value}|" "$APP_DIR/.env"
                else
                  printf '%s=%s\n' "$key" "$value" | sudo tee -a "$APP_DIR/.env" > /dev/null
                fi
              }

              set_env AI_API_IMAGE_TAG "$target_api"
              set_env EMBEDDING_IMAGE_TAG "$target_embedding"
              sudo chown root:root "$APP_DIR/.env"
              sudo chmod 600 "$APP_DIR/.env"

              aws ecr get-login-password --region "$AWS_REGION" \
                | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

              compose() {
                sudo docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/compose.yaml" "$@"
              }

              # 대용량 Image Pull의 Docker 진행 로그를 SSM 표준 출력으로 그대로 흘리지 않는다.
              # SSM Agent의 출력 처리 부담을 줄이고, 대신 15초마다 짧은 상태 로그만 남긴다.
              pull_with_heartbeat() {
                service="$1"
                pull_log="/tmp/zipsai-${service}-pull.log"

                # --quiet: Docker의 Downloading/Extracting 진행 로그를 숨긴다.
                # 실패한 경우에만 아래에서 마지막 로그를 출력한다.
                compose pull --quiet "$service" >"$pull_log" 2>&1 &
                pull_pid="$!"

                while kill -0 "$pull_pid" 2>/dev/null; do
                  echo "$service image pull in progress..."
                  sleep 15
                done

                if ! wait "$pull_pid"; then
                  echo "$service image pull failed. Recent Docker output:" >&2
                  tail -n 80 "$pull_log" >&2 || true
                  return 1
                fi

                rm -f "$pull_log"
              }

              if [ "$API_REQUESTED" = true ] && [ "$EMBEDDING_REQUESTED" = true ]; then
                pull_with_heartbeat ai-api
                pull_with_heartbeat embedding
                compose up -d qdrant embedding ai-api
              elif [ "$API_REQUESTED" = true ]; then
                pull_with_heartbeat ai-api
                compose up -d --no-deps ai-api
              else
                pull_with_heartbeat embedding
                compose up -d --no-deps embedding
              fi

              wait_healthy() {
                service="$1"
                for _ in $(seq 1 36); do
                  container_id="$(compose ps -q "$service")"
                  if [ -n "$container_id" ]; then
                    status="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
                    echo "$service: $status"
                    [ "$status" = healthy ] && return 0
                  fi
                  sleep 5
                done
                echo "$service Health Check timed out." >&2
                return 1
              }

              if [ "$API_REQUESTED" = true ]; then
                wait_healthy ai-api
              fi

              if [ "$EMBEDDING_REQUESTED" = true ]; then
                wait_healthy embedding
              fi
          REMOTE_SCRIPT
            } > remote-deploy.sh

            encoded_script="$(base64 < remote-deploy.sh | tr -d '\n')"
            jq -n \
              --arg command "echo '$encoded_script' | base64 --decode | bash" \
              '{commands: [$command]}' > ssm-parameters.json

            command_id="$(aws ssm send-command \
              --document-name AWS-RunShellScript \
              --instance-ids "$INSTANCE_ID" \
              --parameters file://ssm-parameters.json \
              --timeout-seconds 900 \
              --comment "Deploy AI API=${api_tag:-current}, Embedding=${embedding_tag:-current}" \
              --query 'Command.CommandId' \
              --output text)"

            # 최초 Image Pull·Model 로딩을 고려해 SSM 상태를 최대 15분간 직접 확인한다.
            status=""
            for _ in $(seq 1 180); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true)"

              case "$status" in
                Success)
                  break
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$INSTANCE_ID" \
                    --output json || true
                  return 1
                  ;;
              esac
              sleep 5
            done

            if [ "$status" != "Success" ]; then
              echo "SSM deployment timed out after 15 minutes. Last status: ${status:-unknown}" >&2
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --output json || true
              return 1
            fi

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
              --output json
          }

          get_current_sha() {
            aws ssm get-parameter \
              --name "$1" \
              --query 'Parameter.Value' \
              --output text 2>/dev/null || true
          }

          previous_api=""
          previous_embedding=""
          if [ "$API_REQUESTED" = true ]; then
            previous_api="$(get_current_sha "$AI_API_CURRENT_SHA_PARAMETER")"
          fi
          if [ "$EMBEDDING_REQUESTED" = true ]; then
            previous_embedding="$(get_current_sha "$EMBEDDING_CURRENT_SHA_PARAMETER")"
          fi

          rollback() {
            # 둘을 함께 배포한 경우에는 한쪽만 남기지 않고 이전 정상 조합으로 함께 복구한다.
            if [ "$API_REQUESTED" = true ] && [ -z "$previous_api" ]; then
              echo "이전 정상 AI API SHA가 없어 자동 롤백할 수 없습니다." >&2
              return 1
            fi
            if [ "$EMBEDDING_REQUESTED" = true ] && [ -z "$previous_embedding" ]; then
              echo "이전 정상 Embedding SHA가 없어 자동 롤백할 수 없습니다." >&2
              return 1
            fi

            echo "배포 확인에 실패했습니다. 이전 정상 SHA로 복구합니다." >&2
            run_remote_deploy \
              "${previous_api:-$API_TAG}" \
              "${previous_embedding:-$EMBEDDING_TAG}" \
              "$API_REQUESTED" \
              "$EMBEDDING_REQUESTED"
          }

          if ! run_remote_deploy "$API_TAG" "$EMBEDDING_TAG" "$API_REQUESTED" "$EMBEDDING_REQUESTED"; then
            rollback || true
            # 복구에 성공해도 새 버전 배포는 실패했으므로 Workflow는 실패로 남긴다.
            exit 1
          fi

          # Health Check를 통과한 서비스만 다음 배포의 자동 롤백 기준으로 기록한다.
          if [ "$API_REQUESTED" = true ]; then
            aws ssm put-parameter \
              --name "$AI_API_CURRENT_SHA_PARAMETER" \
              --type String \
              --value "$API_TAG" \
              --overwrite > /dev/null
          fi
          if [ "$EMBEDDING_REQUESTED" = true ]; then
            aws ssm put-parameter \
              --name "$EMBEDDING_CURRENT_SHA_PARAMETER" \
              --type String \
              --value "$EMBEDDING_TAG" \
              --overwrite > /dev/null
          fi

          # 현재 배포한 SHA와 바로 직전 정상 SHA만 남긴다.
          # 삭제에 실패해도 배포 자체는 성공했으므로 Workflow를 실패 처리하지 않는다.
          cleanup_remote_images() {
            local encoded_script command_id status

            {
              printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
              printf 'ECR_REGISTRY=%q\n' "$ECR_REGISTRY"
              printf 'API_TAG=%q\n' "$API_TAG"
              printf 'EMBEDDING_TAG=%q\n' "$EMBEDDING_TAG"
              printf 'PREVIOUS_API=%q\n' "$previous_api"
              printf 'PREVIOUS_EMBEDDING=%q\n' "$previous_embedding"
              printf 'API_REQUESTED=%q\n' "$API_REQUESTED"
              printf 'EMBEDDING_REQUESTED=%q\n' "$EMBEDDING_REQUESTED"
              cat <<'REMOTE_CLEANUP'
              cleanup_service_images() {
                repository="$1"
                current_tag="$2"
                previous_tag="$3"

                [ -n "$current_tag" ] || return 0

                sudo docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' \
                  | while IFS= read -r image_ref; do
                      case "$image_ref" in
                        "$repository:$current_tag"|"$repository:$previous_tag")
                          echo "keep $image_ref"
                          ;;
                        "$repository:<none>")
                          ;;
                        *)
                          echo "remove unused image $image_ref"
                          sudo docker image rm "$image_ref" \
                            || echo "could not remove $image_ref; it may still be referenced by a Container"
                          ;;
                      esac
                    done
              }

              if [ "$API_REQUESTED" = true ]; then
                cleanup_service_images "$ECR_REGISTRY/zipsai-ai-api" "$API_TAG" "$PREVIOUS_API"
              fi
              if [ "$EMBEDDING_REQUESTED" = true ]; then
                cleanup_service_images "$ECR_REGISTRY/zipsai-embedding" "$EMBEDDING_TAG" "$PREVIOUS_EMBEDDING"
              fi
          REMOTE_CLEANUP
            } > remote-cleanup.sh

            encoded_script="$(base64 < remote-cleanup.sh | tr -d '\n')"
            jq -n \
              --arg command "echo '$encoded_script' | base64 --decode | bash" \
              '{commands: [$command]}' > ssm-cleanup-parameters.json

            command_id="$(aws ssm send-command \
              --document-name AWS-RunShellScript \
              --instance-ids "$INSTANCE_ID" \
              --parameters file://ssm-cleanup-parameters.json \
              --comment "Clean unused AI images" \
              --query 'Command.CommandId' \
              --output text)"

            for _ in $(seq 1 36); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true)"
              case "$status" in
                Success)
                  return 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  return 1
                  ;;
              esac
              sleep 5
            done

            return 1
          }

          cleanup_remote_images || echo "::warning::Unused AI image cleanup failed. The deployment itself succeeded."
