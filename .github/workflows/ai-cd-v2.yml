name: AI CD V2 EC2
on:
  workflow_run:
    workflows: [AI CI V2]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      service:
        description: V2 Production service
        required: true
        type: choice
        options: [ai-api, embedding, qdrant]
      image_tag:
        description: Staging-verified SHA7 (Qdrant uses the Compose pin; leave empty)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ai-cd-v2-${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}
  cancel-in-progress: false
env:
  AWS_REGION: ap-northeast-2
jobs:
  select:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'staging' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      revision: ${{ steps.select.outputs.revision }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_run ]]; then
            [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo environment=staging >> "$GITHUB_OUTPUT"
            echo "revision=$CI_SHA" >> "$GITHUB_OUTPUT"
            echo "tag=${CI_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            if [[ "$SERVICE" != qdrant ]]; then
              [[ "$MANUAL_TAG" =~ ^[0-9a-f]{7}$ ]]
            else
              [[ -z "$MANUAL_TAG" ]]
            fi
            echo environment=production >> "$GITHUB_OUTPUT"
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.select.outputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Skip superseded staging run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ needs.select.outputs.environment }}
          CI_SHA: ${{ needs.select.outputs.revision }}
        run: |
          set -euo pipefail
          current=true
          if [[ "$ENVIRONMENT" == staging ]]; then
            latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)"
            [[ "$latest" == "$CI_SHA" ]] || current=false
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - name: Read selection from this successful CI run only
        if: steps.freshness.outputs.current == 'true' && needs.select.outputs.environment == 'staging'
        uses: actions/download-artifact@v4
        with:
          name: ai-v2-selection
          path: selection
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v5
        if: steps.freshness.outputs.current == 'true'
        with:
          role-to-assume: ${{ vars.AWS_AI_CD_V2_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy AI-owned Compose via SSM
        if: steps.freshness.outputs.current == 'true'
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ needs.select.outputs.environment }}
          IMAGE_TAG: ${{ needs.select.outputs.tag }}
          SERVICE: ${{ inputs.service }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
        shell: python
        run: |
          #!/usr/bin/env python3
          """GitHub runner: reads infrastructure metadata, never application secret values."""
          import argparse
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import time
          
          BASE = Path.cwd()
          REMOTE_SOURCE = r'''
          #!/usr/bin/env python3
          """Runs as root only on a V2 AI host. Never prints parameter values."""
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          import uuid
          
          SECRET_KEYS = {"OPENROUTER_API_KEY", "SERVERLESS_API_KEY", "POD_API_KEY", "QDRANT_API_KEY",
                         "QDRANT_ADMIN_API_KEY", "QDRANT_READ_ONLY_API_KEY", "LANGFUSE_SECRET_KEY",
                         "QDRANT__SERVICE__API_KEY", "QDRANT__SERVICE__READ_ONLY_API_KEY",
                         "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"}
          BASE = Path("/opt/zipsai/ai-v2")
          
          def aws(args):
              return json.loads(subprocess.check_output(["aws", *args, "--output", "json"],
                                                        stderr=subprocess.DEVNULL))
          
          def parameter(path, region, secure=False):
              args = ["ssm", "get-parameter", "--region", region, "--name", path]
              if secure:
                  args += ["--with-decryption"]
              result = aws(args)["Parameter"]
              if (result["Type"] == "SecureString") != secure:
                  raise ValueError("Parameter type mismatch")
              return result["Value"]
          
          def dotenv(values):
              rows = []
              for key, value in sorted(values.items()):
                  if not re.fullmatch(r"[A-Z][A-Z0-9_]*", key) or not isinstance(value, str):
                      raise ValueError("Invalid environment")
                  if any(c in value for c in "\n\r\x00"):
                      raise ValueError("Multiline environment is not supported")
                  escaped = value.replace("\\", "\\\\").replace('"', '\\"').replace("$", "$$")
                  rows.append(f'{key}="{escaped}"')
              return "\n".join(rows) + "\n"
          
          def runtime(config):
              region = config["region"]
              host = config["host"]
              values = json.loads(parameter(host["runtime_parameter"], region))
              if SECRET_KEYS.intersection(values):
                  raise ValueError("Secrets must not be stored in runtime JSON")
              for key, path in host["runtime_parameters"].items():
                  values[key] = parameter(path, region)
              if SECRET_KEYS.intersection(values):
                  raise ValueError("Secrets must use the secure map")
              for key, path in host["secret_parameters"].items():
                  values[key] = parameter(path, region, secure=True)
                  if not values[key]:
                      raise ValueError("Empty secret")
              role = config["service"]
              if role == "ai-api":
                  for key in ["QDRANT_URL", "EMBEDDING_API_URL", "S3_BUCKET",
                              "OPENROUTER_BASE_URL", "OPENROUTER_LLM_MODEL", "OPENROUTER_VLM_MODEL",
                              "SERVERLESS_BASE_URL", "SERVERLESS_MODEL", "POD_BASE_URL", "POD_MODEL"]:
                      if not values.get(key):
                          raise ValueError("Required AI configuration is missing")
                  for key in ["OPENROUTER_API_KEY", "SERVERLESS_API_KEY", "POD_API_KEY"]:
                      if not values.get(key):
                          raise ValueError("All provider API keys are required")
                  for key in ["OPENROUTER_BASE_URL", "SERVERLESS_BASE_URL", "POD_BASE_URL"]:
                      if not values[key].startswith("https://"):
                          raise ValueError("Provider base URLs must use HTTPS")
                  if not values.get("QDRANT_ADMIN_API_KEY"):
                      raise ValueError("Qdrant admin key is required")
              if role == "qdrant":
                  if not all(values.get(k) for k in ["QDRANT_ADMIN_API_KEY", "QDRANT_READ_ONLY_API_KEY"]):
                      raise ValueError("Qdrant keys required")
                  if values["QDRANT_ADMIN_API_KEY"] == values["QDRANT_READ_ONLY_API_KEY"]:
                      raise ValueError("Use different Qdrant keys")
              values.update(AWS_REGION=region, LOG_GROUP=host["log_group"], IMAGE_URI=config["image_uri"])
              return values
          
          def compose(release, role, *args):
              return subprocess.run(["docker", "compose", "--project-name", f"zipsai-ai-v2-{role}",
                                     "--env-file", str(release / "runtime.env"),
                                     "-f", str(release / "compose.yaml"), *args],
                                    cwd=release, stdout=subprocess.DEVNULL,
                                    stderr=subprocess.DEVNULL, check=True)
          
          def healthy(release, role, timeout=900):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  result = subprocess.run(
                      ["docker", "compose", "--project-name", f"zipsai-ai-v2-{role}",
                       "--env-file", str(release / "runtime.env"), "-f", str(release / "compose.yaml"),
                       "ps", "-q", role], cwd=release, capture_output=True, text=True, check=True)
                  cid = result.stdout.strip()
                  if cid:
                      status = subprocess.check_output(
                          ["docker", "inspect", "--format",
                           "{{if .State.Health}}{{.State.Health.Status}}{{end}}", cid],
                          stderr=subprocess.DEVNULL, text=True).strip()
                      if status == "healthy":
                          return True
                      if status == "unhealthy":
                          return False
                  time.sleep(5)
              return False
          
          def deployed_image(release, role):
              if release is None or not release.is_dir():
                  return None
              result = subprocess.check_output(
                  ["docker", "compose", "--project-name", f"zipsai-ai-v2-{role}",
                   "--env-file", str(release / "runtime.env"), "-f", str(release / "compose.yaml"),
                   "ps", "-q", role], cwd=release, stderr=subprocess.DEVNULL, text=True).strip()
              if not re.fullmatch(r"[0-9a-f]{12,64}", result):
                  return None
              return subprocess.check_output(
                  ["docker", "inspect", "--format", "{{.Image}}", result],
                  stderr=subprocess.DEVNULL, text=True).strip()

          def cleanup_previous_image(previous_image, release, role, image_uri):
              # Best effort, after health and current-release commit only. Never force or prune globally.
              if role == "qdrant" or not previous_image:
                  return
              try:
                  if (not re.fullmatch(r"sha256:[0-9a-f]{64}", previous_image)
                          or previous_image == deployed_image(release, role)):
                      return
                  image = json.loads(subprocess.check_output(
                      ["docker", "image", "inspect", previous_image],
                      stderr=subprocess.DEVNULL, text=True))[0]
                  repository = image_uri.split("@", 1)[0]
                  references = (image.get("RepoTags") or []) + (image.get("RepoDigests") or [])
                  if not references or any(
                      ref.split("@", 1)[0] != repository if "@" in ref
                      else ref.rsplit(":", 1)[0] != repository for ref in references
                  ):
                      return
                  users = subprocess.check_output(
                      ["docker", "ps", "-a", "-q", "--filter", "ancestor=" + previous_image],
                      stderr=subprocess.DEVNULL, text=True).strip()
                  if users:
                      return
                  subprocess.run(["docker", "image", "rm", previous_image],
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                  print("Previous service image removed after successful deployment", flush=True)
              except Exception:
                  print("Warning: previous-image cleanup skipped; deployment remains healthy", flush=True)

          def run(config_path):
              import fcntl
              os.umask(0o077)
              if os.geteuid() != 0:
                  raise ValueError("Root is required")
              BASE.mkdir(parents=True, exist_ok=True, mode=0o700)
              lock = open(BASE / "deploy.lock", "a")
              fcntl.flock(lock, fcntl.LOCK_EX)
              config = json.loads(config_path.read_text())
              role = config["service"]
              if role not in {"ai-api", "embedding", "qdrant"}:
                  raise ValueError("Unknown service")
              if role == "qdrant":
                  subprocess.run(["mountpoint", "-q", "/data"], check=True)
              release = BASE / ("release-" + uuid.uuid4().hex)
              release.mkdir(mode=0o700)
              # The deployment bundle contains compose.v2.yaml, not the repository's local Compose.
              (release / "compose.yaml").write_bytes((config_path.parent / "compose.v2.yaml").read_bytes())
              (release / "runtime.env").write_text(dotenv(runtime(config)))
              compose(release, role, "config", "-q")
              if role != "qdrant":
                  registry = config["image_uri"].split("/")[0]
                  pw = subprocess.check_output(["aws", "ecr", "get-login-password", "--region",
                                                config["region"]], stderr=subprocess.DEVNULL)
                  subprocess.run(["docker", "login", "--username", "AWS", "--password-stdin", registry],
                                 input=pw, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
              print("Pulling selected image", flush=True)
              current = BASE / "current"
              previous = current.resolve() if current.is_symlink() else None
              previous_image = None
              if role != "qdrant":
                  try:
                      previous_image = deployed_image(previous, role)
                  except Exception:
                      print("Warning: previous image could not be identified; cleanup disabled", flush=True)
              compose(release, role, "pull", "--quiet", role)
              try:
                  print("Applying AI-owned Compose", flush=True)
                  compose(release, role, "up", "-d", "--no-build", "--no-deps", role)
                  if not healthy(release, role):
                      raise RuntimeError("Health check failed")
              except Exception:
                  restored = False
                  try:
                      if previous is not None and previous.is_dir():
                          compose(previous, role, "up", "-d", "--no-build", "--no-deps", role)
                          restored = healthy(previous, role)
                      else:
                          compose(release, role, "down")  # No --volumes; bind data preserved.
                  except Exception:
                      pass
                  print("Rollback health verified" if restored else "No verified rollback; inspect this V2 host",
                        flush=True)
                  raise RuntimeError("New deployment failed") from None
              pending = BASE / "current.next"
              if pending.is_symlink():
                  pending.unlink()
              pending.symlink_to(release)
              os.replace(pending, current)
              print("Container health passed; model/indexing end-to-end tests are separate", flush=True)
              cleanup_previous_image(previous_image, release, role, config["image_uri"])
          
          if __name__ == "__main__":
              try:
                  run(Path(sys.argv[1]))
              except Exception:
                  print("V2 AI deployment failed; parameter values and raw process output suppressed",
                        file=sys.stderr)
                  sys.exit(1)
          '''
          REGION = "ap-northeast-2"
          REGISTRY = "929368845727.dkr.ecr.ap-northeast-2.amazonaws.com"
          SERVICES = {"ai-api", "embedding", "qdrant"}
          
          def aws(*args):
              return json.loads(subprocess.check_output(
                  ["aws", "--region", REGION, *args, "--output", "json"], stderr=subprocess.DEVNULL))
          
          def validate_tag(service, tag):
              if service not in SERVICES:
                  raise ValueError("Unsupported service")
              if service == "qdrant":
                  if tag:
                      raise ValueError("Qdrant version is owned by its Compose pin")
              elif not re.fullmatch(r"[0-9a-f]{7}", tag):
                  raise ValueError("Use a staging-verified SHA7 tag")
          
          def config_hash(service):
              digest = hashlib.sha256()
              for name in ["compose.v2.yaml"]:
                  digest.update(name.encode() + b"\0" + (BASE / name).read_bytes() + b"\0")
              digest.update(REMOTE_SOURCE.encode())
              digest.update(Path(".github/workflows/ai-cd-v2.yml").read_bytes())
              return digest.hexdigest()
          
          def pinned_qdrant(compose_text):
              match = re.search(r"^\s+image:\s+(qdrant/qdrant:(v[0-9]+\.[0-9]+\.[0-9]+))\s*$",
                                compose_text, re.MULTILINE)
              if not match:
                  raise ValueError("Pin a numeric Qdrant version in Compose")
              return match.group(1), match.group(2)
          
          def guard_host(environment, service, host, instance):
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              if (instance["InstanceId"] != host["instance_id"] or
                  instance["State"]["Name"] != "running" or
                  tags.get("Name") != f"zipsai-{environment}-{service}" or
                  tags.get("Environment") != environment or tags.get("Project") != "zipsai"):
                  raise ValueError("Refusing a non-matching V2 AI instance")
              if service == "ai-api":
                  for key, suffix in [
                      ("OPENROUTER_BASE_URL", "openrouter-base-url"),
                      ("OPENROUTER_LLM_MODEL", "openrouter-llm-model"),
                      ("OPENROUTER_VLM_MODEL", "openrouter-vlm-model"),
                      ("SERVERLESS_BASE_URL", "serverless-base-url"),
                      ("SERVERLESS_MODEL", "serverless-model"),
                      ("POD_BASE_URL", "pod-base-url"),
                      ("POD_MODEL", "pod-model"),
                  ]:
                      if host["runtime_parameters"].get(key) != f"/zipsai/{environment}/ai/{suffix}":
                          raise ValueError("Apply all AI provider parameter mappings before deployment")
                  for key, suffix in [
                      ("OPENROUTER_API_KEY", "openrouter-api-key"),
                      ("SERVERLESS_API_KEY", "serverless-api-key"),
                      ("POD_API_KEY", "pod-api-key"),
                  ]:
                      if host["secret_parameters"].get(key) != f"/zipsai/{environment}/ai/{suffix}":
                          raise ValueError("Apply all AI provider secret mappings before deployment")
              if environment == "prod" and service in {"ai-api", "embedding"}:
                  expected = "/zipsai/prod/ai/v2/langfuse/"
                  for key, suffix in [("LANGFUSE_BASE_URL", "base-url"), ("LANGFUSE_PUBLIC_KEY", "public-key")]:
                      if host["runtime_parameters"].get(key) != expected + suffix:
                          raise ValueError("Prod V2 Langfuse paths are not applied")
                  if host["secret_parameters"].get("LANGFUSE_SECRET_KEY") != expected + "secret-key":
                      raise ValueError("Prod V2 Langfuse secret mapping is not applied")
          
          def assert_promotion(record, expected):
              if any(record.get(k) != v for k, v in expected.items()):
                  raise ValueError("Staging image/Compose/helper verification does not match")
          
          def bundle_command(config, compose_text):
              files = {"manifest.json": json.dumps(config), "compose.v2.yaml": compose_text,
                       "remote.py": REMOTE_SOURCE}
              payload = base64.b64encode(json.dumps(files).encode()).decode()
              if len(payload) > 45000:
                  raise ValueError("SSM inline bundle too large; use a reviewed artifact transport")
              installer = (
                  "import base64,json,os,pathlib,subprocess,tempfile;"
                  "os.umask(0o077);"
                  "base=pathlib.Path('/opt/zipsai/ai-v2');base.mkdir(parents=True,exist_ok=True,mode=0o700);"
                  "root=pathlib.Path(tempfile.mkdtemp(prefix='bundle-',dir=base));"
                  f"files=json.loads(base64.b64decode('{payload}'));"
                  "[(root/name).write_text(files[name]) for name in ['manifest.json','compose.v2.yaml','remote.py']];"
                  "subprocess.run(['python3',str(root/'remote.py'),str(root/'manifest.json')],check=True)"
              )
              return "set +x\ncloud-init status --wait >/dev/null\npython3 -c " + shlex.quote(installer)
          
          def main(environment, service, tag):
              if environment == "staging" and service in {"ai-api", "embedding"} and not tag:
                  pass  # Compose-only: resolve current staging image below.
              else:
                  validate_tag(service, tag)
              if environment not in {"staging", "prod"}:
                  raise ValueError("Unsupported environment")
              name = f"/zipsai/{environment}/ai/deployment-contract"
              contract = json.loads(aws("ssm", "get-parameter", "--name", name)["Parameter"]["Value"])
              host = contract[service]
              instances = aws("ec2", "describe-instances", "--instance-ids", host["instance_id"])
              instance = instances["Reservations"][0]["Instances"][0]
              guard_host(environment, service, host, instance)
              compose_text = (BASE / "compose.v2.yaml").read_text()
              lookup_identity = tag
              if service == "qdrant":
                  uri, identity = pinned_qdrant(compose_text)
              elif tag:
                  repo = "zipsai-" + service
                  image = aws("ecr", "describe-images", "--repository-name", repo,
                              "--image-ids", "imageTag=" + tag)["imageDetails"][0]
                  digest = image["imageDigest"]
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                      raise ValueError("Missing image digest")
                  uri, identity = f"{REGISTRY}/{repo}@{digest}", tag
              else:
                  # Compose-only staging change: use the image that last passed health.
                  current_path = f"/zipsai/staging/deploy/ai-v2/{service}/verified/current"
                  current = json.loads(aws("ssm", "get-parameter", "--name", current_path)["Parameter"]["Value"])
                  uri, identity = current["image_uri"], current["image_tag"]
                  if not re.fullmatch(r"[0-9a-f]{7}", identity):
                      raise ValueError("No valid previously deployed SHA7; first deploy needs an app image build")
                  repo = "zipsai-" + service
                  if not re.fullmatch(re.escape(REGISTRY + "/" + repo) + r"@sha256:[0-9a-f]{64}", uri):
                      raise ValueError("Invalid previous image")
              expected = {"service": service, "image_uri": uri, "config_hash": config_hash(service)}
              verified_path = f"/zipsai/staging/deploy/ai-v2/{service}/verified/{identity}"
              if environment == "prod":
                  record = json.loads(aws("ssm", "get-parameter", "--name", verified_path)["Parameter"]["Value"])
                  assert_promotion(record, expected)
              config = {"region": REGION, "service": service, "host": host, "image_uri": uri}
              command = bundle_command(config, compose_text)
              sent = aws("ssm", "send-command", "--document-name", "AWS-RunShellScript",
                         "--instance-ids", host["instance_id"], "--timeout-seconds", "600",
                         "--parameters", json.dumps({"commands": [command], "executionTimeout": ["3300"]}),
                         "--comment", f"V2 AI-owned {environment}/{service} deployment")
              cid = sent["Command"]["CommandId"]
              print(f"SSM command {cid}: {environment}/{service}", flush=True)
              deadline = time.monotonic() + 3450
              while time.monotonic() < deadline:
                  try:
                      result = aws("ssm", "get-command-invocation", "--command-id", cid,
                                   "--instance-id", host["instance_id"])
                  except subprocess.CalledProcessError:
                      time.sleep(5)
                      continue
                  status = result["Status"]
                  if status == "Success":
                      break
                  if status in {"Failed", "Cancelled", "TimedOut", "Cancelling"}:
                      raise RuntimeError(f"SSM {status}; inspect command {cid}; no raw output printed")
                  time.sleep(10)
              else:
                  raise RuntimeError(f"SSM wait expired; command {cid} may still be running")
              if environment == "staging":
                  record = dict(expected, image_tag=identity, source_revision=os.environ.get("GITHUB_SHA", ""),
                                workflow_run=os.environ.get("GITHUB_RUN_ID", ""))
                  for path in [verified_path, f"/zipsai/staging/deploy/ai-v2/{service}/verified/current"]:
                      aws("ssm", "put-parameter", "--name", path, "--type", "String",
                          "--value", json.dumps(record), "--overwrite")
              summary = f"{environment}/{service}: container health passed; {uri}\n"
              print(summary, end="")
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                      stream.write(summary)
          
          if __name__ == "__main__":
              try:
                  environment = os.environ["DEPLOYMENT_ENVIRONMENT"]
                  if environment == "staging":
                      selection = json.loads(Path("selection/deployment-selection.json").read_text())
                      revision = os.environ["CI_REVISION"]
                      if selection["revision"] != revision:
                          raise ValueError("CI selection revision mismatch")
                      selected = selection["services"]
                      seen = set()
                      for item in selected:
                          if (set(item) != {"service", "rebuild"} or item["service"] not in SERVICES
                                  or type(item["rebuild"]) is not bool or item["service"] in seen
                                  or (item["service"] == "qdrant" and item["rebuild"])):
                              raise ValueError("Invalid deployment selection")
                          seen.add(item["service"])
                      for role in ["qdrant", "embedding", "ai-api"]:
                          for item in selected:
                              if item["service"] == role:
                                  main("staging", role, revision[:7] if item["rebuild"] else "")
                      if not selected:
                          print("No service changes; nothing deployed")
                  elif environment == "production":
                      main("prod", os.environ["SERVICE"], os.environ.get("IMAGE_TAG", ""))
                  else:
                      raise ValueError("Unknown environment")
              except Exception as error:
                  print(f"V2 AI deployment failed: {type(error).__name__}", file=sys.stderr)
                  sys.exit(1)
