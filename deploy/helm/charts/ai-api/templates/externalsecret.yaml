{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-secret" .Values.workload }}
  labels:
    {{- include "v3.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    force-sync: {{ .Values.externalSecret.forceSync | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ printf "v3-%s-parameter-store" .Values.environment }}
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-secret" .Values.workload }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key, $suffix := .Values.externalSecret.parameters }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "/zipsai/v3/%s/%s" $.Values.environment $suffix | quote }}
    {{- end }}
{{- end }}
