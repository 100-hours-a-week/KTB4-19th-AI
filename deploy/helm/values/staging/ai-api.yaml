workload: ai-api
environment: staging
component: ai
image:
  repository: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com/zipsai-ai-api
  tag: ''
command: []
args:
- --timeout-graceful-shutdown
- '140'
replicaCount: 1
containerPort: 8000
service:
  enabled: true
  port: 8000
  annotations: {}
env:
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  QDRANT_URL: http://qdrant.staging.zipsai.internal:6333
  QDRANT_COLLECTION: documents
  S3_BUCKET: zipsai-staging-uploads
  EMBEDDING_API_URL: http://embedding-service.staging.svc.cluster.local:8000
  ACTIVE_MODEL_PROVIDER: pod
  LANGFUSE_TRACING_ENABLED: 'false'
externalSecret:
  enabled: true
  forceSync: '1'
  parameters:
    QDRANT_API_KEY: ai-api/qdrant-api-key
    RUNPOD_API_KEY: ai-api/runpod-api-key
    RUNPOD_POD_NAME_PREFIX: ai-api/runpod-pod-name-prefix
    POD_API_KEY: ai-api/pod-api-key
    POD_MODEL: ai-api/pod-model
    OPENROUTER_API_KEY: ai-api/openrouter-api-key
    OPENROUTER_BASE_URL: ai-api/openrouter-base-url
    OPENROUTER_LLM_MODEL: ai-api/openrouter-llm-model
    OPENROUTER_VLM_MODEL: ai-api/openrouter-vlm-model
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 2Gi
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
  environment: staging
  role: general
tolerations: []
spread:
  enabled: false
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: false
  minAvailable: 1
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
terminationGracePeriodSeconds: 150
preStopSeconds: 0
probes:
  startup:
    httpGet:
      path: /liveness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    httpGet:
      path: /readiness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /liveness
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
