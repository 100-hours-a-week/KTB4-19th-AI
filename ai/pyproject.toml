[project]
name = "zipsai"
version = "0.1.0"
description = "zipsAI API"
readme = "README.md"
authors = [
    { name = "nuebaek", email = "nuebaek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "docling",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "langgraph>=1.2.11",
    "openai>=3.14.0",
    "pydantic>=2.13.5,<3",
    "qdrant-client==1.19.0",
    "torch",
    "torchvision",
    "uvicorn>=0.53.0",
]

[project.scripts]
zipsai = "zipsai:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
exclude = ["evals"]

[tool.ruff.lint.isort]
known-first-party = ["zipsai", "embedding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
