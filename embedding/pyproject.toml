[project]
name = "embedding"
version = "0.1.0"
description = "BGE-M3 embedding service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "FlagEmbedding>=1.3",
    "qdrant-client==1.19.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
