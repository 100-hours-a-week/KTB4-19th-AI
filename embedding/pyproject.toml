[project]
name = "embedding"
version = "0.1.0"
description = "BGE-M3 embedding service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "FlagEmbedding>=1.3",
    "pydantic>=2,<3",
    # CPU 전용 휠로 고정하려고 직접 선언한다. FlagEmbedding이 끌고 오는
    # 기본 torch는 CUDA 런타임(nvidia-*, triton) 4GB를 함께 받아온다.
    "torch",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
# macOS 휠은 원래 CPU 전용이라 리눅스에서만 인덱스를 바꾼다.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx",
    "numpy",
    "pytest",
    "ruff",
]
