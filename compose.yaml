# Local development only. Host port bindings below are for local debugging via
# 127.0.0.1 only — in production none of these ports should be opened externally;
# all inter-service traffic stays on the Docker internal network.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  embedding:
    build: ./embedding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  zipsai-api:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 배포 환경은 EC2 인스턴스 프로파일에서 자격증명을 받는다(s3.py 참고). 로컬에는
      # 프로파일이 없어 색인이 S3에서 막히므로, 비어 있으면 무시되는 형태로만 넘긴다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://embedding:8000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 비어 있으면 settings.py의 DEFAULT_VLM_MODEL로 떨어진다.
      VLM_MODEL: ${VLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy

volumes:
  qdrant-data:
